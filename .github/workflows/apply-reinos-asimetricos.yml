name: Apply Reinos Asimétricos
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: reinos-asimetricos-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asymmetric kingdoms
        run: python3 scripts/apply-reinos-asimetricos.py
      - name: Apply strategic hardening
        run: python3 scripts/finalize-reinos-asimetricos.py
      - name: Validate generated game
        run: |
          node --check rey/game.js
          node --check rey/net.js
          node --check rey/app.js
          node --check rey/chronicle.js
          node --check rey/sw.js
          node scripts/validate.mjs
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "Reinos Asimétricos already hardened"
            exit 0
          fi
          git config user.name "reinos-asymmetry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rey README.md scripts/validate.mjs
          git commit -m "fix: hold Bastions and expose strategic objectives [asym-final]"
          git push origin HEAD:${{ github.head_ref }}
