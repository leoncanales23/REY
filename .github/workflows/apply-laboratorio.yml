name: Apply Laboratorio del Reino
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: laboratorio-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scenario and replay laboratory
        id: apply_lab
        continue-on-error: true
        run: |
          base64 -d scripts/apply-lab.py.gz.b64 | gzip -d > /tmp/apply-lab.py
          python3 /tmp/apply-lab.py > /tmp/lab-transform.log 2>&1
      - name: Publish transformer diagnostic
        if: steps.apply_lab.outcome == 'failure'
        run: |
          cp /tmp/lab-transform.log /tmp/lab-transform-error.txt
          git reset --hard HEAD
          cp /tmp/lab-transform-error.txt scripts/lab-transform-error.txt
          git config user.name "reinos-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/lab-transform-error.txt
          git commit -m "chore: capture laboratory transformer diagnostic"
          git push origin HEAD:${{ github.head_ref }}
          exit 1
      - name: Validate generated laboratory
        if: steps.apply_lab.outcome == 'success'
        run: |
          node --check rey/game.js
          node --check rey/net.js
          node --check rey/app.js
          node --check rey/chronicle.js
          node --check rey/campaign.js
          node --check rey/scenario.js
          node --check rey/replay.js
          node --check rey/sw.js
          node scripts/validate.mjs
      - name: Commit generated source
        if: steps.apply_lab.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo "Laboratory already applied"
            exit 0
          fi
          git config user.name "reinos-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rey README.md scripts/validate.mjs
          git commit -m "feat: add scenario laboratory and deterministic replays [lab-generated]"
          git push origin HEAD:${{ github.head_ref }}
