name: Apply Comandantes y Eventos
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: comandantes-eventos-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply commanders and world events
        run: python3 scripts/apply-comandantes-eventos.py
      - name: Apply commander hardening
        run: python3 scripts/finalize-comandantes-eventos.py
      - name: Validate generated game
        run: |
          node --check rey/game.js
          node --check rey/net.js
          node --check rey/app.js
          node --check rey/chronicle.js
          node --check rey/sw.js
          node scripts/validate.mjs
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "Comandantes y Eventos already hardened"
            exit 0
          fi
          git config user.name "reinos-commanders-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rey README.md scripts/validate.mjs
          git commit -m "fix: harden commander powers and tactical vision [commanders-final]"
          git push origin HEAD:${{ github.head_ref }}
