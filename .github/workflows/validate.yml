name: Validate REINOS
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
permissions:
  contents: read
jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check rey/game.js
          node --check rey/net.js
          node --check rey/app.js
          node --check rey/chronicle.js
          node --check rey/campaign.js
          node --check rey/scenario.js
          node --check rey/replay.js
          node --check rey/determinism.js
          node --check rey/sw.js
          node --check rey/world.js
          node --check rey/world-map.js
          node --check rey/era-core.js
          node --check rey/content/eras/rey.js
          node --check rey/content/eras/chile1810.js
          node --check rey/content/eras/mars2135.js
      - name: Validate app shell and config
        run: node scripts/validate.mjs
      - name: Check canonical checksum contract
        run: node scripts/test-determinism.mjs
      - name: Check region progression
        run: node scripts/test-world.mjs
      - name: Check Era Pack registry and multiplayer contract
        run: node scripts/test-era-core.mjs
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check kingdom browser journey
        run: npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-browser-evidence
          path: artifacts/
      - name: Check browser determinism
        run: node scripts/browser-determinism.mjs
