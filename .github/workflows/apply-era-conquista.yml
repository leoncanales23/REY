name: Finalize Era de Conquista
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: era-conquista-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final hardening
        run: python3 scripts/finalize-era-conquista.py
      - name: Validate final game
        run: |
          node --check rey/game.js
          node --check rey/net.js
          node --check rey/app.js
          node --check rey/chronicle.js
          node --check rey/sw.js
          node scripts/validate.mjs
      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo "Hardening already applied"
            exit 0
          fi
          git config user.name "reinos-conquest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rey/game.js scripts/validate.mjs
          git commit -m "fix: harden conquest progression and client building [era-final]"
          git push origin HEAD:${{ github.head_ref }}
