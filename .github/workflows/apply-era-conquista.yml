name: Apply Era de Conquista
on:
  push:
    branches: [feat/era-conquista]
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  transform:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[era-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align one-shot transformer
        run: |
          sed -i "s/Validación estática y contrato de salas de REINOS completados\./Validación estática, contrato de salas y Crónica de Guerra completados\./" scripts/apply-era-conquista.mjs
      - name: Apply source transformation
        id: transform
        continue-on-error: true
        run: |
          if grep -q "const AGE_DEFS =" rey/game.js; then
            echo "Era de Conquista ya aplicada"
            exit 0
          fi
          node scripts/apply-era-conquista.mjs > era-transform.log 2>&1
      - name: Report transformer failure
        if: ${{ steps.transform.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### 🔧 Diagnóstico del transformador"
            echo '```text'
            tail -n 100 era-transform.log
            echo '```'
          } > era-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file era-comment.md
      - name: Stop after transformer failure
        if: ${{ steps.transform.outcome == 'failure' }}
        run: exit 1
      - name: Validate generated game
        run: |
          node --check rey/game.js
          node --check rey/net.js
          node --check rey/app.js
          node --check rey/chronicle.js
          node --check rey/sw.js
          node scripts/validate.mjs
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "Sin cambios nuevos"
            exit 0
          fi
          git config user.name "reinos-conquest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rey README.md scripts/validate.mjs
          git commit -m "feat: add Era de Conquista [era-generated]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
